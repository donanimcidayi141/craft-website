<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Güvenlik Test Sayfası</title>
  <script>
    window.__xssExecuted = true;
    console.warn('Bu betik asla çalıştırılmamalıdır');
  </script>
</head>
<body onload="window.__onloadExecuted = true" style="background-color: #111827; color: #f8fafc;">

      <input type="text" name="eposta" placeholder="E-posta adresiniz" />

    </form>

    document.body.setAttribute('data-script-ran', '1');
