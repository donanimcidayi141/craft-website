<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Satır İçi Stil Örneği</title>
</head>
<body style="margin: 0; background-color: #18181b; color: #f4f4f5; font-family: sans-serif;">
  <header style="padding: 20px 36px; background-color: #27272a; border-bottom: 1px solid #3f3f46;">
    <span style="font-size: 18px; font-weight: 700; color: #fbbf24;">Anadolu Kahve Kavurma</span>
  </header>
  <section style="padding: 40px 36px; background-color: #1f1f23;">
    <h1 style="font-size: 36px; font-weight: 800; color: #ffffff; margin: 0 0 12px 0;">Taze Kavrulmuş Çekirdekler</h1>
    <p style="font-size: 16px; color: #d4d4d8; margin: 0 0 20px 0;">Her sabah küçük partiler halinde kavrulan seçkin yöresel kahveler.</p>
    <div style="display: flex; gap: 16px;">
      <div style="background-color: #27272a; padding: 20px; border-radius: 12px; width: 280px;">
        <h3 style="font-size: 18px; color: #fde68a; margin: 0 0 8px 0;">Etiyopya Yirgacheffe</h3>
        <p style="font-size: 14px; color: #a1a1aa; margin: 0;">Bergamot ve yasemin notaları.</p>
      </div>
      <div style="background-color: #27272a; padding: 20px; border-radius: 12px; width: 280px;">
        <h3 style="font-size: 18px; color: #fde68a; margin: 0 0 8px 0;">Kolombiya Huila</h3>
        <p style="font-size: 14px; color: #a1a1aa; margin: 0;">Karamel ve kırmızı meyve dengesi.</p>
      </div>
    </div>
    <button style="margin-top: 24px; background-color: #f59e0b; color: #18181b; padding: 12px 24px; border-radius: 8px; font-weight: 700;">Sipariş Oluştur</button>
  </section>
</body>
</html>
